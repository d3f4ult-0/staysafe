name: CI Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Privacy Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bengal_safety_map
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy "psycopg[binary]" geoalchemy2 shapely pytest httpx python-dateutil requests

      - name: Initialize DB & Seed Demo Data
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bengal_safety_map
        run: |
          PYTHONPATH=apps/api/src python -m bengal_safety_map.cli db init
          PYTHONPATH=apps/api/src python -m bengal_safety_map.cli seed demo
          PYTHONPATH=apps/api/src python -m bengal_safety_map.cli package build

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bengal_safety_map
        run: |
          PYTHONPATH=apps/api/src pytest tests/test_api_and_pipeline.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm --prefix apps/web install

      - name: Next.js Production Build
        run: npm --prefix apps/web run build

  mobile-tests:
    name: Mobile App Quality Gates & Export
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm install --legacy-peer-deps

      - name: TypeScript Static Typecheck
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Run Mobile Test Suite
        working-directory: apps/mobile
        run: npm test

      - name: Export Mobile Bundle (Android Target)
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-android
