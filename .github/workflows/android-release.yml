name: Build Android Release (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target: apk (direct sideload) or aab (Google Play)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Static Typecheck & Unit Tests
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm test

      - name: Generate Android Native Project (Expo Prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Create Release Signing Keystore
        working-directory: apps/mobile/android/app
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias bengalsafety \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bengalsafetypass \
            -keypass bengalsafetypass \
            -dname "CN=Bengal Safety Map, OU=CivicTech, O=Bengal Safety Map, L=Kolkata, ST=West Bengal, C=IN"

      - name: Configure Gradle Signing & Kotlin 1.9.25 Compatibility
        run: |
          python3 -c "
          import os

          # 1. Configure Keystore signing in app/build.gradle
          app_gradle = 'apps/mobile/android/app/build.gradle'
          with open(app_gradle, 'r') as f:
              app_content = f.read()

          signing_block = '''
              release {
                  storeFile file('release.keystore')
                  storePassword 'bengalsafetypass'
                  keyAlias 'bengalsafety'
                  keyPassword 'bengalsafetypass'
              }
          '''
          if 'signingConfigs {' in app_content:
              app_content = app_content.replace('signingConfigs {', 'signingConfigs {\n' + signing_block)
              app_content = app_content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              with open(app_gradle, 'w') as f:
                  f.write(app_content)
              print('Configured app/build.gradle signing successfully')

          # 2. Configure root build.gradle for Kotlin 1.9.25 & Compose compiler compatibility
          root_gradle = 'apps/mobile/android/build.gradle'
          with open(root_gradle, 'r') as f:
              root_content = f.read()

          root_content = root_content.replace(
              \"classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')\",
              \"classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')\"
          )
          root_content = root_content.replace(
              'classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin\")',
              \"classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')\"
          )
          if 'rootProject.ext.kotlinVersion' not in root_content:
              root_content = \"rootProject.ext.set('kotlinVersion', '1.9.25')\n\" + root_content

          suppression_block = '''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                          kotlinOptions {
                              freeCompilerArgs += [
                                  '-P',
                                  'plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true'
                              ]
                          }
                      }
                  }
              }
          }
          '''
          if 'suppressKotlinVersionCompatibilityCheck' not in root_content:
              root_content += suppression_block

          with open(root_gradle, 'w') as f:
              f.write(root_content)
          print('Configured root build.gradle with Kotlin 1.9.25 successfully')

          # 3. Configure gradle.properties
          props_path = 'apps/mobile/android/gradle.properties'
          with open(props_path, 'a') as f:
              f.write('''
          kotlinVersion=1.9.25
          android.kotlinVersion=1.9.25
          kotlin.suppressKotlinVersionCompatibilityCheck=true
          android.suppressKotlinVersionCompatibilityCheck=true
          composeCompiler.suppressKotlinVersionCompatibilityCheck=true
          ''')
          print('Configured gradle.properties successfully')
          "

      - name: Build Signed Android APK (Direct End-User Install)
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PkotlinVersion=1.9.25 -Pandroid.kotlinVersion=1.9.25 --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../../bengal-safety-map.apk

      - name: Build Android AAB (Release Bundle for Google Play)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease -PkotlinVersion=1.9.25 -Pandroid.kotlinVersion=1.9.25 --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../../../bengal-safety-map.aab

      - name: Upload Signed APK to GitHub Artifacts
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        uses: actions/upload-artifact@v4
        with:
          name: bengal-safety-map-apk
          path: bengal-safety-map.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB to GitHub Artifacts
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        uses: actions/upload-artifact@v4
        with:
          name: bengal-safety-map-aab
          path: bengal-safety-map.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach Signed APK & AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bengal-safety-map.apk
            bengal-safety-map.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
