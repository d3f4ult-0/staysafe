name: Build Android Release (APK & AAB)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build target: apk (direct sideload) or aab (Google Play)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - both
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Static Typecheck & Unit Tests
        working-directory: apps/mobile
        run: |
          npm run typecheck
          npm test

      - name: Generate Android Native Project (Expo Prebuild)
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Create Release Signing Keystore
        working-directory: apps/mobile/android/app
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias bengalsafety \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bengalsafetypass \
            -keypass bengalsafetypass \
            -dname "CN=Bengal Safety Map, OU=CivicTech, O=Bengal Safety Map, L=Kolkata, ST=West Bengal, C=IN"

      - name: Configure Gradle Signing & Kotlin 1.9.25 Compatibility
        run: python3 scripts/configure_android_release.py

      - name: Build Signed Android APK (Direct End-User Install)
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PkotlinVersion=1.9.25 -Pandroid.kotlinVersion=1.9.25 --no-daemon
          ls -la app/build/outputs/apk/release/
          if [ -f app/build/outputs/apk/release/app-arm64-v8a-release.apk ]; then
            cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../../../bengal-safety-map-arm64.apk
          fi
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk ../../../bengal-safety-map-universal.apk
            cp app/build/outputs/apk/release/app-universal-release.apk ../../../bengal-safety-map.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../../../bengal-safety-map.apk
          fi

      - name: Build Android AAB (Release Bundle for Google Play)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease -PkotlinVersion=1.9.25 -Pandroid.kotlinVersion=1.9.25 --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../../../bengal-safety-map.aab

      - name: Upload Signed APK to GitHub Artifacts
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        uses: actions/upload-artifact@v4
        with:
          name: bengal-safety-map-apk
          path: |
            bengal-safety-map-arm64.apk
            bengal-safety-map-universal.apk
            bengal-safety-map.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB to GitHub Artifacts
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == null }}
        uses: actions/upload-artifact@v4
        with:
          name: bengal-safety-map-aab
          path: bengal-safety-map.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Attach Signed APK & AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bengal-safety-map-arm64.apk
            bengal-safety-map-universal.apk
            bengal-safety-map.apk
            bengal-safety-map.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
